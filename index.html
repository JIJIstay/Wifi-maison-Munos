<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Wi-Fi</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f5f5f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 350px;
      width: 100%;
    }
    h1 { font-size: 22px; color: #1d1d1f; margin-bottom: 5px; }
    p { font-size: 14px; color: #86868b; margin-bottom: 20px; }
    .wifi-name {
      font-weight: bold;
      font-size: 18px;
      color: #0071e3;
      background: #e8f2ff;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 20px;
      word-break: break-all;
    }
    .qr-container img {
      width: 200px;
      height: 200px;
      border-radius: 12px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 12px;
      background-color: #0071e3;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      box-sizing: border-box;
    }
    .btn-secondary {
      background-color: #e8e8ed;
      color: #1d1d1f;
    }
    .toast {
      display: none;
      margin-top: 10px;
      color: #34c759;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Rejoindre le Wi-Fi</h1>
    <p>Scannez le QR Code ou copiez le mot de passe ci-dessous.</p>

    <!-- REMPLACE TON_NOM_DE_BOX PAR LE NOM DE TON WIFI -->
    <div class="wifi-name">📶 <span id="ssid">Bbox-F126C2FB</span></div>

    <div class="qr-container">
      <!-- LE QR CODE SE GÉNÈRE AUTOMATIQUEMENT ICI -->
      <img id="qr-img" src="" alt="QR Code WiFi">
    </div>

    <button class="btn" onclick="copyPassword()">Copier le mot de passe</button>
    <div id="toast" class="toast">Mot de passe copié !</div>

    <!-- REMPLACE VOTRE_MOT_DE_PASSE PAR LE VRAI MOT DE PASSE -->
    <script>
      const wifiSSID = "Bbox-F126C2FB";
      const wifiPassword = "iNATwXAV93YaPjjQzx";
      const wifiType = "WPA"; // Ou "WEP", ou "nopass" si réseau ouvert

      // Génération de l'image QR code dynamique via API gratuite
      const qrData = `WIFI:T:${wifiType};S:${wifiSSID};P:${wifiPassword};;`;
      document.getElementById('qr-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(qrData)}`;

      function copyPassword() {
        navigator.clipboard.writeText(wifiPassword).then(() => {
          const toast = document.getElementById('toast');
          toast.style.display = 'block';
          setTimeout(() => { toast.style.display = 'none'; }, 3000);
        });
      }
    </script>
  </div>

</body>
</html>
